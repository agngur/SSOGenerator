[project]
name = "SSOGenerator"
version = "0.2.0"
description = "Project repository for 2D (or 3D) modelling of a satellites orbiting Earth."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["astropy","numpy","pandas","skyfield","vpython"]
authors = [
    {name = "Agnieszka Gurgul", email = "agn.gurgul@umk.pl"}
]

[build-system]
requires = [
    "setuptools >= 77.0.3",
    "cython >= 3.0.0",
    "numpy"
    ]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ssogenerator"]
ext-modules = [ { name = "ssogenerator.utils.ctle_checksum", sources = ["ssogenerator/utils/ctle_checksum_wrapper.pyx", "ssogenerator/utils/ctle_checksum.cpp"], language = "c++" } ]

[tool.cython]
language_level = "3"